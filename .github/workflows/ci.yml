name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: 3.13.5

      - name: Install dependencies
        run: dart pub get

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Check generated code is committed and current
        working-directory: packages/potato_core
        run: |
          dart run build_runner build --delete-conflicting-outputs
          git diff --exit-code -- . || {
            echo '::error::Generated files are stale. Run build_runner and commit them.'
            exit 1
          }
          test -z "$(git status --porcelain -- .)" || {
            git status --porcelain -- .
            echo '::error::Generated files are not committed.'
            exit 1
          }

      - name: Analyze
        run: dart analyze --fatal-infos

      - name: Test server
        run: dart test

      - name: Test potato_core
        working-directory: packages/potato_core
        run: dart test

      - name: Test potato_core common code on JavaScript
        working-directory: packages/potato_core
        run: dart test -p node test/common
